<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="logo-icône.svg" type="image/svg+xml">
<title>ESLA Voyage — Travailler à l'étranger, accompagné·e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#132A3A; --navy-2:#1E4258; --teal:#2F7A82; --gold:#C99A3B;
  --cream:#F6F3EC; --ink:#1B2429; --line:#DDD6C6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:76px}
body{margin:0; font-family:'Inter',sans-serif; color:var(--ink); background:var(--cream); line-height:1.55}
h1,h2,h3{font-family:'Fraunces',serif; margin:0 0 .4em; color:var(--navy); line-height:1.15}
p{margin:0 0 1em}
a{color:inherit}
.wrap{max-width:1080px; margin:0 auto; padding:0 20px}
section{padding:64px 0}
.eyebrow{color:var(--teal); font-weight:600; letter-spacing:.02em}

/* NAV */
header{position:sticky; top:0; z-index:50; background:rgba(246,243,236,.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px)}
nav.wrap{display:flex; align-items:center; justify-content:space-between; padding:14px 20px; gap:10px}
.logo{font-family:'Fraunces',serif; font-weight:700; font-size:1.25rem; color:var(--navy); text-decoration:none; white-space:nowrap}
.navlinks{display:none; gap:18px; font-size:.92rem; font-weight:500}
.navlinks a{text-decoration:none}
.navlinks a:hover{color:var(--teal)}
@media(min-width:900px){.navlinks{display:flex}}
.navright{display:flex; align-items:center; gap:8px}
.langsel{display:flex; gap:4px; border:1px solid var(--line); border-radius:20px; padding:3px}
.langbtn{border:none; background:none; padding:5px 9px; border-radius:16px; font-size:.8rem; font-weight:600; cursor:pointer; color:var(--navy-2)}
.langbtn.active{background:var(--navy); color:#fff}
.burger{display:block; background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--navy)}
@media(min-width:900px){.burger{display:none}}
.mobilemenu{display:none; flex-direction:column; padding:0 20px 16px; gap:10px}
.mobilemenu.open{display:flex}
.mobilemenu a{text-decoration:none; padding:8px 0; border-bottom:1px solid var(--line)}

/* HERO */
.hero{background:linear-gradient(135deg,var(--navy) 0%, var(--navy-2) 55%, var(--teal) 100%); color:#fff; position:relative; overflow:hidden}
.hero .wrap{padding:60px 20px 60px; position:relative; z-index:2; display:grid; gap:36px; grid-template-columns:1fr}
@media(min-width:840px){.hero .wrap{grid-template-columns:1.2fr .8fr; align-items:center; padding:80px 20px}}
.hero h1{color:#fff; font-size:clamp(2rem,5vw,3.1rem); max-width:14ch}
.hero p{color:#E4E9EC; max-width:52ch; font-size:1.08rem}
.hero-photo{display:flex; justify-content:center}
.hero-photo img{width:100%; max-width:300px; aspect-ratio:3/4; object-fit:cover; border-radius:6px; border:3px solid rgba(255,255,255,.25); box-shadow:0 18px 40px rgba(0,0,0,.35)}
.hero-photo-cap{text-align:center; font-size:.85rem; color:#E4E9EC; margin-top:10px}
.flagstripe{position:absolute; inset:0; opacity:.16; background:
  linear-gradient(90deg, #C60B1E 0%,#C60B1E 25%, #FFC400 25%,#FFC400 50%, #C60B1E 50%,#C60B1E 51%, #fff 51%,#fff 63%, #D80621 63%,#D80621 76%, #002395 76%,#002395 88%, #fff 88%,#fff 94%, #B31942 94%,#B31942 100%);
}
.cta-row{display:flex; flex-wrap:wrap; gap:14px; margin-top:28px}
.btn{display:inline-flex; align-items:center; gap:8px; padding:13px 22px; border-radius:3px; font-weight:600; text-decoration:none; font-size:.98rem; cursor:pointer; border:1px solid transparent}
.btn-gold{background:var(--gold); color:#1B2429}
.btn-outline{border-color:#fff; color:#fff; background:transparent}
.btn-whatsapp{background:#25D366; color:#08341B}
.btn:active{transform:translateY(1px)}

/* DESTINATIONS */
.grid4{display:grid; grid-template-columns:1fr; gap:20px}
@media(min-width:640px){.grid4{grid-template-columns:1fr 1fr}}
.dest{background:#fff; border:1px solid var(--line); border-radius:4px; overflow:hidden}
.dest-top{height:74px}
.dest-es{background:linear-gradient(90deg,#AA151B 0 25%,#F1BF00 25% 75%,#AA151B 75% 100%)}
.dest-ca{background:linear-gradient(90deg,#D80621 0 25%,#fff 25% 75%,#D80621 75% 100%)}
.dest-us{background:repeating-linear-gradient(180deg,#B31942 0 10px,#fff 10px 20px)}
.dest-fr{background:linear-gradient(90deg,#002395 0 33%,#fff 33% 66%,#ED2939 66% 100%)}
.dest-body{padding:20px}
.dest-body h3{font-size:1.25rem}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.tag{font-size:.78rem; background:var(--cream); border:1px solid var(--line); padding:4px 10px; border-radius:20px; color:var(--navy-2)}

/* SERVICES */
.services-list{display:grid; gap:16px; grid-template-columns:1fr}
@media(min-width:640px){.services-list{grid-template-columns:1fr 1fr}}
.service{border-left:3px solid var(--teal); padding:6px 0 6px 16px}
.service h3{font-size:1.08rem; margin-bottom:4px}
.notice{background:#fff; border:1px solid var(--line); border-left:4px solid var(--gold); padding:16px 18px; border-radius:4px; font-size:.95rem; margin-top:28px}

/* STEPS */
.steps{counter-reset:step; display:grid; gap:22px}
.step{display:flex; gap:16px; align-items:flex-start}
.step::before{counter-increment:step; content:counter(step); flex:0 0 auto; width:38px; height:38px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:600}
.step h3{margin-bottom:2px; font-size:1.05rem}
.step p{margin:0}

/* TESTIMONIALS */
.testi-grid{display:grid; gap:16px; grid-template-columns:1fr}
@media(min-width:640px){.testi-grid{grid-template-columns:repeat(3,1fr)}}
.testi{border:1.5px dashed var(--line); border-radius:6px; padding:22px; text-align:center; color:#7A7568; font-size:.92rem; background:#fff}

/* FAQ */
details{border-bottom:1px solid var(--line); padding:14px 0}
summary{cursor:pointer; font-weight:600; color:var(--navy); font-family:'Fraunces',serif; font-size:1.05rem}
details p{margin-top:10px}

/* CONTACT */
.contact-grid{display:grid; gap:32px; grid-template-columns:1fr}
@media(min-width:840px){.contact-grid{grid-template-columns:1fr 1.2fr}}
form{display:grid; gap:12px}
input,select,textarea{font-family:inherit; font-size:.98rem; padding:12px 14px; border:1px solid var(--line); border-radius:4px; background:#fff; width:100%}
label{font-size:.85rem; font-weight:600; color:var(--navy-2); margin-bottom:2px; display:block}
.field{display:flex; flex-direction:column}
#formMsg{font-size:.9rem; padding:10px 0; display:none}

footer{background:var(--navy); color:#C9D2D6; padding:36px 0; font-size:.88rem}
footer a{color:#fff}

.wa-float{position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); right:20px; z-index:60; background:#25D366; color:#08341B; width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.6rem; text-decoration:none; box-shadow:0 4px 14px rgba(0,0,0,.25)}
</style>
</head>

function applyLang(lang){
  const dict = I18N[lang] || I18N.fr;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var key = el.getAttribute('data-i18n');
    if(dict[key]) el.textContent = dict[key];
  });
  document.documentElement.lang = lang;
  document.querySelectorAll('.langbtn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-lang') === lang);
  });
  try{ localStorage.setItem('esla_lang', lang); }catch(e){}
  window.__eslaLang = lang;
}
document.querySelectorAll('.langbtn').forEach(function(b){
  b.addEventListener('click', function(){ applyLang(b.getAttribute('data-lang')); });
});
var savedLang = 'fr';
try{ savedLang = localStorage.getItem('esla_lang') || 'fr'; }catch(e){}
applyLang(savedLang);

document.getElementById('year').textContent = new Date().getFullYear();
if(CONTACT_EMAIL){ document.getElementById('emailDisplay').removeAttribute('data-i18n'); document.getElementById('emailDisplay').textContent = CONTACT_EMAIL; }

function waLink(prefill){
  if(!WHATSAPP_NUMBER) return null;
  return "https://wa.me/" + WHATSAPP_NUMBER + (prefill ? ("?text=" + encodeURIComponent(prefill)) : "");
}
["heroWaBtn","contactWaBtn","floatWaBtn"].forEach(function(id){
  var el = document.getElementById(id);
  el.addEventListener('click', function(e){
    e.preventDefault();
    var dict = I18N[window.__eslaLang] || I18N.fr;
    var link = waLink(dict["wa.prefill"]);
    if(link){ window.open(link, "_blank"); }
    else{ alert(dict["wa.noNumber"]); }
  });
});

document.getElementById('burgerBtn').addEventListener('click', function(){
  document.getElementById('mobileMenu').classList.toggle('open');
});
document.querySelectorAll('.mobilemenu a').forEach(function(a){
  a.addEventListener('click', function(){ document.getElementById('mobileMenu').classList.remove('open'); });
});

document.getElementById('contactForm').addEventListener('submit', function(e){
  e.preventDefault();
  var dict = I18N[window.__eslaLang] || I18N.fr;
  var nom = document.getElementById('nom').value;
  var whatsapp = document.getElementById('whatsapp').value;
  var email = document.getElementById('email').value;
  var pays = document.getElementById('pays').value;
  var domaine = document.getElementById('domaine').value;
  var message = document.getElementById('message').value;
  var body = "Nom/Name: "+nom+"\nWhatsApp: "+whatsapp+"\nE-mail: "+email+"\nPays/Country: "+pays+"\nDomaine/Field: "+domaine+"\nMessage: "+message;
  var msgEl = document.getElementById('formMsg');
  if(CONTACT_EMAIL){
    window.location.href = "mailto:"+CONTACT_EMAIL+"?subject="+encodeURIComponent("Demande d'information - "+nom)+"&body="+encodeURIComponent(body);
    msgEl.textContent = dict["form.msgMailto"];
  } else {
    msgEl.textContent = dict["form.msgNoEmail"];
  }
  msgEl.style.display = "block";
});
</script>
